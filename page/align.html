<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>架空路線の線形（確認用）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* the map above and the profile below, linked: moving either moves the other to the same chainage */
  :root { --font: "BIZ UDGothic", "Hiragino Sans", "BIZ UDPGothic", sans-serif; --ink: #1c2433; --sub: #5a6577; --line: #d6dbe4; --tline: #c3cad6; --bg: #f4f6fa; --accent: #1f5fa8; --cur: #d62728; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  /* one font for the page, the map labels (Leaflet sets Helvetica/Arial on its container) and the profile canvas: BIZ UDGothic first, its figures
     of one width suit the values in columns (2026-11-04, the user's phone draws the panel in it and the map labels were proportional) */
  body, .leaflet-container { font-family: var(--font); }
  body { display: flex; flex-direction: column; color: var(--ink); background: var(--bg); }
  #map { flex: 1 1 58%; min-height: 160px; }
  #panel { flex: 0 0 auto; max-height: 75%; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: #fff; min-height: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  #bar { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; padding: 8px max(10px, env(safe-area-inset-left, 0px)) 6px; font-size: 13px; }
  #bar .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flat { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  /* the summary: label and value pairs, not one sentence cut by dots */
  #sum { display: flex; flex-wrap: wrap; gap: 2px 14px; line-height: 1.4; }
  #sum span { white-space: nowrap; } #sum b { font-weight: 400; color: var(--sub); font-size: 11px; margin-right: 4px; } #sum small { color: var(--sub); font-size: 11px; }
  .seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; padding: 4px 8px; border: 0; background: #fff; color: var(--accent); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #sysSel { font: inherit; font-size: 13px; padding: 3px 4px; max-width: 13em; min-width: 0; flex: 1 1 auto; }
  #sysSel:disabled { opacity: .45; }
  /* the values at the current chainage: a table with fixed columns, so that each value stays at the same place */
  /* one table: the label and its unit in the head, the values (numbers only) right-aligned below, the same padding in every cell */
  /* the two tables joined into one (no gap): one line between the upper and the lower rows (the lower table's top line, drawn over the
     upper one's bottom line by the margin of −1 px) */
  /* the line between the upper and the lower rows, in the same colour as the other lines of the table (--tline: a little darker than --line,
     which could not be told from the header's background: the user's report) */
  #tbls .vt + .vt { border-top: 1px solid var(--tline); }
  .vt { width: 100%; margin-top: -1px; table-layout: fixed; border-collapse: collapse; font-variant-numeric: tabular-nums; border: 1px solid var(--tline); }
  .vt th { font-size: 10px; font-weight: 400; color: var(--sub); background: var(--bg); text-align: center; white-space: nowrap; overflow: hidden; padding: 2px 0 1px; letter-spacing: -.02em; line-height: 1.2; }
  .vt th i { font-style: normal; font-size: 8.5px; margin-left: 2px; }
  .vt td { font-size: 14px; line-height: 1.3; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: clip; padding: 2px 3px; border-left: 1px solid var(--tline); }
  .vt th + th { border-left: 1px solid var(--tline); }
  #read td:first-child { font-weight: 700; }
  /* disclosure triangles (2026-11-04, the user's request: not a framed button, and a larger triangle): turned to the right when closed */
  .disc { font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px 2px 0; border: 0; background: none; color: var(--ink); cursor: pointer; }
  .disc .tri { width: 14px; height: 14px; fill: var(--sub); transition: transform .15s; }
  .disc[aria-expanded="false"] .tri { transform: rotate(-90deg); }
  #setting { display: flex; flex-direction: column; gap: 6px; }
  .vt td.t { text-align: center; font-size: 12px; }
  #train td.t { font-size: 11px; }
  /* the legend: on the map, at the lower left */
  /* two rows side by side (the limits; tunnel and bridge), and folded to one word on a tap (2026-11-04, the user's request: compact) */
  .leaflet-bottom.leaflet-left .legend { margin: 0; border-radius: 0 4px 0 0; }
  .legend { background: rgba(255,255,255,.88); border-radius: 4px; padding: 2px 6px; font-size: 10px; line-height: 1.6; color: var(--ink); box-shadow: 0 0 2px rgba(0,0,0,.3); cursor: pointer; max-width: calc(100vw - 120px); }
  .legend div { display: flex; flex-wrap: wrap; gap: 0 7px; }
  .legend span { white-space: nowrap; }
  .legend b { font-weight: 400; color: var(--sub); }
  .legend b.fx { min-width: 0; margin-left: auto; padding-left: 8px; }
  #opts { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; }
  #opts label { white-space: nowrap; cursor: pointer; }
  .legend i { display: inline-block; width: 10px; height: 4px; vertical-align: middle; margin-right: 2px; }
  #msg { flex: 1 1 100%; }
  #prof { flex: 0 0 auto; height: max(170px, 24vh); position: relative; touch-action: none; cursor: grab; }
  #prof canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 500; }
  #cross::before, #cross::after { content: ""; position: absolute; background: var(--cur); }
  #cross::before { left: 10px; top: 0; width: 2px; height: 22px; } #cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
  #mapwrap { position: relative; flex: 1 1 58%; min-height: 160px; display: flex; }
  #mapwrap #map { flex: 1; }
  #lock { position: fixed; inset: 0; z-index: 2000; background: rgba(244,246,250,.97); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #lock form { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: 360px; font-size: 14px; line-height: 1.6; }
  #lock input { font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; padding: 8px; margin: 8px 0; }
  #lock button { font: inherit; padding: 8px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; }
  .st-label { font-size: 12px; white-space: nowrap; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; color: #222; }
  .st-label.stop { font-weight: 700; font-size: 13px; }
  .cv-label span { position: absolute; display: block; white-space: nowrap; }
  .zs-label span { position: absolute; display: block; white-space: nowrap; font: 700 11px/1 var(--font); padding: 2px 3px; background: #fff; color: #111; border: 1.5px solid #111; border-radius: 3px; font-variant-numeric: tabular-nums; }
  /* the end of a limit: the speed-limit release sign (a square cut by an X, the left and right triangles black), without a number */
  /* slightly wider than tall (10:7, as the user remembers it; no source found). The X joins the corners: atan(20 / 14) = 55 deg from vertical */
  .zs-label span.end { width: 20px; height: 14px; padding: 0; border-radius: 0; background: conic-gradient(#fff 0 55deg, #111 55deg 125deg, #fff 125deg 235deg, #111 235deg 305deg, #fff 305deg); }
  /* the comparison of the variants (2026-11-05, the user's request: the results from the first try to the adopted one, side by side with the
     conditions they were computed under): a table, its rows coloured as their lines on the map; a tap on a row shows that variant's profile */
  #cmpSel { font: inherit; font-size: 13px; padding: 3px 4px; max-width: 16em; min-width: 0; flex: 1 1 auto; }
  #cmpBox { overflow: auto; max-height: 34vh; }
  #cmp { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 100%; }
  #cmp th { font-weight: 400; font-size: 10px; line-height: 1.25; color: var(--sub); background: var(--bg); padding: 2px 4px; border: 1px solid var(--tline); white-space: nowrap; position: sticky; top: 0; }
  #cmp td { padding: 2px 4px; border: 1px solid var(--tline); white-space: nowrap; text-align: right; vertical-align: top; }
  #cmp td.l { text-align: left; white-space: normal; min-width: 8em; }
  #cmp tbody tr { cursor: pointer; } #cmp tr.on td { background: #e8f0fb; }
  #cmp i.c { display: inline-block; width: 14px; height: 5px; vertical-align: middle; margin-right: 4px; }
  #cmp .bad { color: #c92a2a; }
  .cv-label { font-size: 11px; white-space: nowrap; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; color: #444; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="mapwrap"><div id="map"></div><div id="cross"></div></div>
<div id="panel">
  <div id="bar">
    <div class="row">
      <button type="button" id="fold" class="disc" aria-expanded="true"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2.5h8L5 8z"/></svg>設定</button>
      <span class="seg" id="varSeg"></span>
      <select id="sysSel" autocomplete="off" aria-label="系統"></select>
      <select id="cmpSel" autocomplete="off" aria-label="案を比べる線" hidden></select>
      <!-- the comparison table folds away completely (2026-11-05, the user's request: on a phone it took most of the panel) -->
      <button type="button" id="cmpFold" class="disc" aria-expanded="true" hidden><svg class="tri" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 2.5h8L5 8z"/></svg>表</button>
    </div>
    <!-- closed, the settings row keeps the display and system menu (switched most often); opened, the profile window and ［駅地平化］
         (the two that decide the profile) come in one row below it (2026-11-04, the user and I) -->
    <div id="setting">
      <div class="row">
        <span class="seg" id="winSeg"></span>
        <label class="flat"><input type="checkbox" id="o_flat" autocomplete="off"> 駅地平化</label>
      </div>
      <div id="sum"></div>
      <div id="opts"></div>
      <!-- 前の版を重ねる（2026-11-08、ユーザーの指定：今の最終版と新しいやり方の結果を地図で比べる）：全区間の表示と系統の表示で、前の版の線を細く重ねる -->
      <div class="row"><label>前の版を重ねる <select id="snapSel" autocomplete="off"><option value="">なし</option><option value="?">読み込む…</option></select></label></div>
    </div>
    <!-- the comparison of the variants (2026-11-05). Later the variants that were not adopted move to a separate archive page (the user) -->
    <div id="cmpBox" hidden><table id="cmp"></table></div>
    <span id="msg">読み込み中…</span>
    <!-- the line at the current point, and the train (a system only): two tables of one row each (2026-11-04, the user's design) -->
    <div id="tbls"><table id="read" class="vt" hidden><colgroup><col style="width:15%"><col style="width:15%"><col style="width:13%"><col style="width:13%"><col style="width:16%"><col style="width:14%"><col style="width:14%"></colgroup>
      <thead><tr><th>キロ程<i>km</i></th><th>施工基面<i>m</i></th><th>地上高<i>m</i></th><th>勾配<i>‰</i></th><th>平面線形<i>m</i></th><th>構造</th><th>制限<i>km/h</i></th></tr></thead>
      <tbody><tr><td id="r_s"></td><td id="r_z"></td><td id="r_h"></td><td id="r_i"></td><td id="r_p" class="t"></td><td id="r_t" class="t"></td><td id="r_l"></td></tr></tbody></table>
    <!-- the speed at the right end, under the limit of the line table (the same width), to compare the two (2026-11-04, the user's order) -->
    <table id="train" class="vt" hidden><colgroup><col style="width:26%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:12%"><col style="width:11%"><col style="width:11%"><col style="width:14%"></colgroup>
      <thead><tr><th>形式</th><th>振子</th><th>両数</th><th>長さ<i>m</i></th><th>最高<i>km/h</i></th><th>全区間<i>分</i></th><th>経過<i>分</i></th><th>速度<i>km/h</i></th></tr></thead>
      <tbody><tr><td id="r_ty" class="t"></td><td id="r_tl" class="t"></td><td id="r_n"></td><td id="r_len"></td><td id="r_vm"></td><td id="r_rt"></td><td id="r_e"></td><td id="r_v"></td></tr></tbody></table></div>
  </div>
  <div id="prof"><canvas id="cv"></canvas></div>
</div>
<div id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <p>このページの線形は架空のデータで、暗号化されています。テスト版のデバッグモードの合言葉を入れてください（一度入れると、この端末では次から入れずに開けます）。</p>
    <input type="password" id="pass" autocomplete="off" aria-label="合言葉">
    <button type="submit">開く</button> <span id="lockMsg"></span>
  </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // the key of the sealed data: the same as the app's (PBKDF2 of the passphrase), kept by the app on the test site
  const PREFIX = /eki-radar-stg/.test(location.pathname) ? "stg:" : "";
  const SALT = "eki-radar-stg/seal/v1", ITER = 600000;
  let key = null;
  async function useRaw(raw) { key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]); }
  async function openSealed(name) {
    const r = await fetch("../" + name + ".enc");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const b = new Uint8Array(await r.arrayBuffer());
    if (String.fromCharCode(...b.subarray(0, 4)) !== "ERS1") throw new Error("not sealed data");
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(4, 16) }, key, b.subarray(16));
    return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  }
  async function load() {
    const plain = await fetch("data/fiction_align.json").catch(() => null);
    if (plain && plain.ok) return plain.json();
    let k = null;
    try { k = localStorage.getItem(PREFIX + "sealKey"); } catch (e) {}
    if (k) {
      try { await useRaw(Uint8Array.from(atob(k), (c) => c.charCodeAt(0))); return await openSealed("fiction_align.json"); } catch (e) { key = null; }
    }
    return new Promise((resolve) => {
      $("lock").hidden = false;
      $("lockForm").onsubmit = async (ev) => {
        ev.preventDefault(); $("lockMsg").textContent = "確認しています…";
        try {
          const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("pass").value.normalize("NFKC").trim()), "PBKDF2", false, ["deriveBits"]);
          const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode(SALT), iterations: ITER }, base, 256));
          await useRaw(raw);
          if ((await openSealed("seal_check")) !== "ok") throw 0;
          try { localStorage.setItem(PREFIX + "sealKey", btoa(String.fromCharCode(...raw))); } catch (e) {}
          $("lock").hidden = true; resolve(await openSealed("fiction_align.json"));
        } catch (e) { key = null; $("lockMsg").textContent = "合言葉が違います"; }
      };
    });
  }

  // the variants (2026-11-05): a separate file, loaded when the comparison is first opened (plain on a local build, sealed on the test site)
  async function loadVariants() {
    const plain = await fetch("data/fiction_variants.json").catch(() => null);
    if (plain && plain.ok) return plain.json();
    return openSealed("fiction_variants.json");
  }

  const undelta = (a, sc) => { let v = 0; return a.map((d) => (v += d) / sc); };
  // the speed bands of the limit (km/h) and their colours
  const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif"; // the canvas takes the same font
  const BANDS = [[130, "#1a7f37", "130"], [110, "#2f6fd6", "110〜125"], [90, "#b8860b", "90〜105"], [70, "#e8590c", "70〜85"], [0, "#c92a2a", "65 以下"]];
  const bandOf = (v) => BANDS.findIndex(([lo]) => v >= lo);
  const WINS = [2, 5, 10, 20, 50]; // km shown across the profile

  let D, V, SV = null, sel = 0, win = 5, cur = 0, fromProfile = false; // V: what the profile shows (a section, or the selected system); SV: the selected system
  // the comparison of the variants: the data (CMP), on or off, the group (a line, or the express's performances) and the variant shown
  let CMP = null, cmpOn = false, cmpG = 0, cmpV = 0, cmpViews = [];
  const CMP_COLORS = ["#e8590c", "#9c36b5", "#2f9e44", "#c2255c", "#1f5fa8"];
  const map = L.map("map", { preferCanvas: true, zoomControl: true, attributionControl: true });
  const GSI = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>';
  const bases = {
    "淡色地図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", { maxZoom: 18, attribution: GSI }),
    "標準地図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", { maxZoom: 18, attribution: GSI }),
    "陰影起伏図": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png", { maxZoom: 16, maxNativeZoom: 16, attribution: GSI }),
    "写真": L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", { maxZoom: 18, attribution: GSI }),
  };
  bases["淡色地図"].addTo(map);
  L.control.layers(bases, null, { position: "topright" }).addTo(map);
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution("線路は架空");
  const layer = L.layerGroup().addTo(map), origL = L.layerGroup(), vertL = L.layerGroup(), geoL = L.layerGroup().addTo(map), rLabels = L.layerGroup().addTo(map), labels = L.layerGroup().addTo(map);
  // display options, kept on this device
  const OPT_KEY = PREFIX + "alignView", opt = { orig: true, verts: false, radius: true, zones: true, color: true, others: true, sel: 0 };
  try { Object.assign(opt, JSON.parse(localStorage.getItem(OPT_KEY) || "{}")); } catch (e) {}
  const saveOpt = () => { try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) {} };
  const LINE_W = 4, ONE_COLOR = "#1f5fa8", GRAY = "#9aa0a8", PORTAL_R = 7; // px

  // the network (2026-11-04, "the alignment first"): sections, each with its own plan and profile; a system's view is built by
  // joining the parts of the sections on its path (plan points, elements, curves; the profile resampled every 20 m)
  function prepSec(v, i) {
    const lon = undelta(v.lon, 1e5), lat = undelta(v.lat, 1e5);
    const K = 111320 * Math.cos(lat[Math.floor(lat.length / 2)] * Math.PI / 180);
    const z = v.z.map((q) => q / 10), zAlt = v.alt ? v.alt.z.map((q) => q / 10) : z;
    return { ...v, idx: i, lon, lat, K, k: v.k.map((q) => q / 1e7), ground: v.ground.map((g) => g == null ? null : g / 10), z, zBase: z, zAlt,
      structBase: v.struct, structAlt: v.alt ? v.alt.struct : v.struct,
      X: lon.map((q) => q * K), Y: lat.map((q) => q * 110570), orig: { lon: undelta(v.orig.lon, 1e5), lat: undelta(v.orig.lat, 1e5) } };
  }
  function buildView(y, secs) {
    // a piece [section, a, b] with a > b runs the section backwards (2026-11-04: the systems of 蘂取線 go 類平 → 択捉六甲): the chainage
    // of the system grows as the section's falls, the curvature changes sign and a curve to the left becomes one to the right
    const o = { ...y, lat: [], lon: [], s: [], k: [], elements: [], curves: [], ps: [], ground: [], z: [], struct: "" }, pieces = [];
    let off = 0;
    const flip = { "左": "右", "右": "左" };
    for (const [si, a, b] of y.path) {
      const S = secs[si], rev = a > b, lo = Math.min(a, b), hi = Math.max(a, b), map_ = (q) => off + Math.abs(q - a);
      const idx = []; for (let i = 0; i < S.s.length; i++) if (S.s[i] >= lo && S.s[i] <= hi) idx.push(i);
      if (rev) idx.reverse();
      for (const i of idx) {
        const s = map_(S.s[i]); if (o.s.length && s <= o.s[o.s.length - 1]) continue;
        o.s.push(s); o.lat.push(S.lat[i]); o.lon.push(S.lon[i]); o.k.push(rev ? -S.k[i] : S.k[i]);
      }
      const clip = (e) => { const p = map_(Math.max(e[0], lo)), q = map_(Math.min(e[1], hi)); return [Math.min(p, q), Math.max(p, q), e[2], e[3]]; };
      const els = [], cvs = [];
      for (const e of S.elements || []) if (e[1] > lo && e[0] < hi) els.push(clip(e));
      for (const c of S.curves) if (c[1] > lo && c[0] < hi) { const c2 = clip(c); if (rev) c2[3] = flip[c2[3]] || c2[3]; cvs.push(c2); }
      if (rev) { els.reverse(); cvs.reverse(); }
      o.elements.push(...els); o.curves.push(...cvs);
      pieces.push([S, a, b, off]); off += hi - lo;
    }
    for (let g = 0; g <= off + 1e-6; g += 20) {
      const [S, a, b, po] = pieces.find(([, a_, b_, o_]) => g <= o_ + Math.abs(b_ - a_) + 1e-6) || pieces[pieces.length - 1];
      const s = a > b ? a - (g - po) : a + (g - po), j = Math.max(0, Math.min(S.ps.length - 2, Math.floor(s / 20))), t = (s - S.ps[j]) / Math.max(1, S.ps[j + 1] - S.ps[j]);
      const g0 = S.ground[j], g1 = S.ground[j + 1];
      o.ps.push(g); o.z.push(S.z[j] + (S.z[j + 1] - S.z[j]) * t); o.ground.push(g0 == null || g1 == null ? (g0 ?? g1) : g0 + (g1 - g0) * t);

    segment($("winSeg"), WINS.map((w) => [w, `${w} km`]), () => win, (w) => { win = w; redraw(); });
    const OPTS = [["orig", "元の折れ線"], ["verts", "折れ線の頂点"], ["radius", "曲線半径"], ["zones", "制限速度区間"], ["color", "制限速度の色分け"], ["others", "他の区間"]];
    $("opts").innerHTML = OPTS.map(([k, t]) => `<label><input type="checkbox" id="o_${k}" autocomplete="off"${opt[k] ? " checked" : ""}> ${t}</label>`).join("");
    for (const [k] of OPTS) $("o_" + k).onchange = (e) => { opt[k] = e.target.checked; saveOpt(); if (k === "color" || k === "others") drawMap(); else { toggles(); drawGeo(); } };
    // ［駅地平化］: it replaces the profiles of all the sections, so it sits apart from the display options, next to the window buttons
    $("snapSel").onchange = (e) => snapSelect(e.target.value);
    if (opt.snap) snapSelect("?").then(() => { if (CMP && CMP.snapshots.some((s) => s.id === opt.snap)) { $("snapSel").value = opt.snap; drawMap(); } });   // 前回の選択を戻す
    $("o_flat").checked = !!opt.flat;
    $("o_flat").onchange = (e) => { opt.flat = e.target.checked; saveOpt(); applyFlat(); if (cmpOn) useCmp(cmpG, cmpV); else useSel(sel); };
    // one fold (2026-11-04, the user's choice, after two nested folds): closed, every setting is hidden (the window buttons, ［駅地平化］,
    // the display and system menu, the display options), leaving the two tables and the profile under the map
    const fold = (open) => { opt.fold = !open; $("setting").hidden = !open; $("fold").setAttribute("aria-expanded", String(open)); };
    $("fold").onclick = () => { fold(!!opt.fold); saveOpt(); };
    fold(!opt.fold);
    $("msg").hidden = true; $("read").hidden = false;
    applyFlat();
    const T = D.secs[0];
    map.fitBounds(L.latLngBounds(T.lat.map((la, i) => [la, T.lon[i]])));
    const s0 = Number.isInteger(opt.sel) && opt.sel < D.systems.length ? opt.sel : 0; // the last display (kept on this device)
    useSel(s0); segment($("varSeg"), MODES, modeNow, mode);
    if (opt.cmp) enterCmp().then(() => segment($("varSeg"), MODES, modeNow, mode)); // the comparison, if it was open last time
    setTimeout(() => { map.setView(withV(T, () => pointAt(81800)), 14); }, 0); // start at 紗那
  }).catch((e) => { $("msg").textContent = "データを読み込めませんでした（" + e.message + "）"; });
})();
</script>
</body>
</html>
